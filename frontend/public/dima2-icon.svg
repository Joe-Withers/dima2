<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="dima2">
<style>
@keyframes d2-look{0%,10%{transform:translate(0,0)}14%,30%{transform:translate(-15px,0)}35%,38%{transform:translate(0,0)}42%,58%{transform:translate(15px,0)}63%,65%{transform:translate(0,0)}69%,80%{transform:translate(0,-3px)}85%,100%{transform:translate(0,0)}}
@keyframes d2-look-s{0%,10%{transform:translate(0,0)}14%,30%{transform:translate(-4.5px,0)}35%,38%{transform:translate(0,0)}42%,58%{transform:translate(4.5px,0)}63%,65%{transform:translate(0,0)}69%,80%{transform:translate(0,-0.8px)}85%,100%{transform:translate(0,0)}}
@keyframes d2-blink{0%,87%,93%,100%{transform:scaleY(1)}90%{transform:scaleY(.08)}}
@keyframes d2-dl{0%,15%{fill:#343941}18%,29%{fill:#E8A33D}33%,100%{fill:#343941}}
@keyframes d2-dr{0%,43%{fill:#343941}46%,57%{fill:#E8A33D}61%,100%{fill:#343941}}
@keyframes d2-dt{0%,70%{fill:#343941}73%,79%{fill:#E8A33D}83%,100%{fill:#343941}}
@keyframes d2-glow{0%,100%{opacity:.18}50%{opacity:.32}}
.d2-eye{animation:d2-look 8s cubic-bezier(.65,0,.25,1) infinite}
.d2-eye-s{animation:d2-look-s 8s cubic-bezier(.65,0,.25,1) infinite}
.d2-visor{transform-box:view-box;transform-origin:64px 64px;animation:d2-blink 8s ease-in-out infinite}
.d2-visor-s{transform-box:view-box;transform-origin:16px 16.5px;animation:d2-blink 8s ease-in-out infinite}
.d2-halo{animation:d2-glow 2.6s ease-in-out infinite}
.d2-dl{animation:d2-dl 8s linear infinite}
.d2-dr{animation:d2-dr 8s linear infinite}
.d2-dt{animation:d2-dt 8s linear infinite}
@media (prefers-reduced-motion: reduce){.d2-eye,.d2-eye-s,.d2-visor,.d2-visor-s,.d2-halo,.d2-dl,.d2-dr,.d2-dt{animation:none}}</style>
<rect x="2" y="2" width="124" height="124" rx="30" fill="#14171A" stroke="#262A30" stroke-width="1.5"/>
<circle class="d2-dl" cx="16" cy="64" r="4.5" fill="#343941"/>
<circle class="d2-dr" cx="112" cy="64" r="4.5" fill="#343941"/>
<circle class="d2-dt" cx="64" cy="16" r="4.5" fill="#343941"/>
<path d="M64 28C84 28 96 39 96 58V74C96 90 84 100 64 100C44 100 32 90 32 74V58C32 39 44 28 64 28Z" fill="#20252B" stroke="#3A4048" stroke-width="2"/>
<path d="M64 29V42M45 84L53 90H75L83 84" fill="none" stroke="#30363D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="d2-visor"><rect x="38" y="55" width="52" height="18" rx="9" fill="#0B0C0E"/><g class="d2-eye"><circle class="d2-halo" cx="64" cy="64" r="9" fill="#E8A33D" opacity=".22"/><circle cx="64" cy="64" r="4.6" fill="#F0B354"/></g></g>
</svg>
