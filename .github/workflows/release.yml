# Push a tag like v0.2.0 (matching the version in backend/pyproject.toml) to publish a wheel with the frontend built in.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches the package version
        working-directory: backend
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Test
        working-directory: backend
        run: |
          command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
          uv run pytest

      - name: Build the frontend into the package
        run: |
          cd frontend && npm ci && npm run build && cd ..
          cp -r frontend/dist backend/dima2/static

      - name: Build the wheel
        working-directory: backend
        run: uv build --wheel

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" backend/dist/*.whl --generate-notes
